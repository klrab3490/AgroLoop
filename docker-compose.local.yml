# ==============================================================================
# Local Docker Compose for AgroLoop (Postgres-Free Local Stack)
# Runs Spring Boot Backend and Next.js Web Client while connecting to
# a local PostgreSQL database running directly on the host machine.
# ==============================================================================

services:
  # ==========================================================
  # Spring Boot Backend Service (Connects to Host PostgreSQL)
  # ==========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agroloop-app-local
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/${POSTGRES_DB:-agroloop}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PORT: 8080
      UPLOAD_DIR: /app/uploads
      SERVER_VERSION: ${SERVER_VERSION:-8.0.0}
      APP_VERSION: ${APP_VERSION:-1.0.6}
      NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-1.0.6}
      EXPO_PUBLIC_APP_VERSION: ${EXPO_PUBLIC_APP_VERSION:-1.0.6}
      VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.6}
      GITHUB_REPO: ${GITHUB_REPO:-AgnaMariya/AgroLoop}
      NEXT_PUBLIC_GITHUB_REPO: ${NEXT_PUBLIC_GITHUB_REPO:-AgnaMariya/AgroLoop}
    volumes:
      - agroloop_local_uploads:/app/uploads
    networks:
      - agroloop-local-network

  # ==========================================================
  # Next.js Web Frontend Service
  # ==========================================================
  web:
    build:
      context: ./clients
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        APP_VERSION: ${APP_VERSION:-1.0.6}
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-1.0.6}
        EXPO_PUBLIC_APP_VERSION: ${EXPO_PUBLIC_APP_VERSION:-1.0.6}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.6}
        GITHUB_REPO: ${GITHUB_REPO:-AgnaMariya/AgroLoop}
        NEXT_PUBLIC_GITHUB_REPO: ${NEXT_PUBLIC_GITHUB_REPO:-AgnaMariya/AgroLoop}
    container_name: agroloop-web-local
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      BACKEND_API_URL: ${BACKEND_API_URL:-http://app:8080}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      APP_VERSION: ${APP_VERSION:-1.0.6}
      NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-1.0.6}
      EXPO_PUBLIC_APP_VERSION: ${EXPO_PUBLIC_APP_VERSION:-1.0.6}
      VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.6}
      GITHUB_REPO: ${GITHUB_REPO:-AgnaMariya/AgroLoop}
      NEXT_PUBLIC_GITHUB_REPO: ${NEXT_PUBLIC_GITHUB_REPO:-AgnaMariya/AgroLoop}
    depends_on:
      - app
    networks:
      - agroloop-local-network

volumes:
  agroloop_local_uploads:
    name: agroloop_local_uploads

networks:
  agroloop-local-network:
    name: agroloop-local-network
