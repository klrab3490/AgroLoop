# ==============================================================================
# Local Docker Compose for AgroLoop (All-in-One Local Development Stack)
# Builds and starts PostgreSQL, Spring Boot Backend, and Next.js Web Client
# ==============================================================================

services:
  # ==========================================================
  # PostgreSQL Database Service
  # ==========================================================
  postgres:
    image: pgvector/pgvector:pg18
    container_name: agroloop-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: agroloop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "7200"
    ports:
      - "5432:5432"
    volumes:
      - agroloop_local_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agroloop-local-network

  # ==========================================================
  # Spring Boot Backend Service
  # ==========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agroloop-app-local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agroloop
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "7200"
      PORT: 8080
      UPLOAD_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - agroloop_local_uploads:/app/uploads
    networks:
      - agroloop-local-network

  # ==========================================================
  # Next.js Web Frontend Service
  # ==========================================================
  web:
    build:
      context: ./clients
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: agroloop-web-local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - app
    networks:
      - agroloop-local-network

volumes:
  agroloop_local_pgdata:
    name: agroloop_local_pgdata
  agroloop_local_uploads:
    name: agroloop_local_uploads

networks:
  agroloop-local-network:
    name: agroloop-local-network
