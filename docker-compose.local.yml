# Local Docker Compose for AgroLoop
# Builds and starts both PostgreSQL and the Spring Boot web application

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agroloop-app-local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agroloop
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "7200"
      PORT: 8080
      UPLOAD_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - agroloop_local_uploads:/app/uploads
    networks:
      - agroloop-local-network

volumes:
  agroloop_local_pgdata:
    name: agroloop_local_pgdata
  agroloop_local_uploads:
    name: agroloop_local_uploads

networks:
  agroloop-local-network:
    name: agroloop-local-network
