# Application Name & Port
spring.application.name=AgroLoop
server.port=${PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agroloop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Multipart File Upload Configuration (Phase 4 Waste Images)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
agroloop.upload.dir=${UPLOAD_DIR:uploads}

# Logging
logging.level.com.agroloop=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# EcoToken Reward Calculation Configuration (Phase 5)
agroloop.tokens.calculator-strategy=standard
agroloop.tokens.promotional.multiplier=1.25
agroloop.tokens.promotional.campaign-name=Spring Community Composting Surge

# OpenAPI 3.1 Configuration (Phase 8 Multi-Platform Contract)
springdoc.api-docs.version=OPENAPI_3_1

# System & API Versioning Metadata (Phase 8 Server Discovery)
agroloop.server.version=${SERVER_VERSION:8.0.0}
agroloop.api.version=v1
agroloop.api.minimum-client-version=${MINIMUM_CLIENT_VERSION:1.0.0}

# Demo Mode & Credentials Gating (Local / Dev vs Production)
agroloop.demo-mode=${DEMO_MODE:true}
agroloop.seed.full-data=${SEED_FULL_DATA:true}


