<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — AgroLoop</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                            950: '#022c22',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #070b14;
        }
        .monospace {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4 sm:p-6 antialiased relative overflow-x-hidden selection:bg-emerald-500 selection:text-white">

    <!-- Ambient Glowing Orbs -->
    <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-emerald-500/10 blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 rounded-full bg-teal-500/10 blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10 space-y-6">
        <!-- Main Card -->
        <div class="bg-slate-900/90 rounded-3xl border border-slate-800 p-8 shadow-2xl backdrop-blur-md space-y-6">
            <!-- Header with Logo -->
            <div class="text-center space-y-2">
                <a th:href="@{/}" class="inline-flex items-center justify-center p-3 rounded-2xl bg-slate-950 border border-slate-800 shadow-md hover:scale-105 transition-transform">
                    <img th:src="@{/images/logo.png}" alt="AgroLoop Logo" class="w-12 h-12 object-contain">
                </a>
                <h1 class="text-2xl font-black text-white tracking-tight">Welcome Back</h1>
                <p class="text-xs text-slate-400">Sign in to access your AgroLoop portal</p>
            </div>

            <!-- Registration Success Notification -->
            <div th:if="${param.registered}" class="p-3.5 rounded-2xl bg-emerald-950/60 border border-emerald-800/80 text-emerald-300 text-xs font-semibold flex items-center gap-2.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span>Registration successful! You can now log in with your credentials.</span>
            </div>

            <!-- Error Notification -->
            <div th:if="${errorMessage}" class="p-3.5 rounded-2xl bg-rose-950/60 border border-rose-800/80 text-rose-300 text-xs font-semibold flex items-center gap-2.5">
                <span class="w-2 h-2 rounded-full bg-rose-400"></span>
                <span th:text="${errorMessage}">Invalid credentials.</span>
            </div>

            <!-- Logout Notification -->
            <div th:if="${logoutMessage}" class="p-3.5 rounded-2xl bg-emerald-950/60 border border-emerald-800/80 text-emerald-300 text-xs font-semibold flex items-center gap-2.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span th:text="${logoutMessage}">Logged out successfully.</span>
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5" for="email">Email Address</label>
                    <input class="w-full px-4 py-3 text-sm rounded-xl bg-slate-950/80 border border-slate-700/80 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition" 
                           type="email" id="email" name="email" placeholder="name@example.com" required autofocus>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="text-xs font-bold text-slate-300" for="password">Password</label>
                    </div>
                    <input class="w-full px-4 py-3 text-sm rounded-xl bg-slate-950/80 border border-slate-700/80 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition" 
                           type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold text-sm rounded-xl shadow-lg shadow-emerald-950/40 transition active:scale-98">
                    Sign In
                </button>
            </form>

            <!-- Registration Link -->
            <div class="text-center text-xs text-slate-400 pt-2 border-t border-slate-800/80">
                Don't have an account? 
                <a th:href="@{/register}" class="font-bold text-emerald-400 hover:text-emerald-300 hover:underline transition">
                    Register as Household
                </a>
            </div>

            <!-- Quick Demo Credentials Helper -->
            <div class="space-y-2.5 pt-2 border-t border-slate-800/80">
                <div class="flex items-center justify-between">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Quick Fill Demo Accounts</span>
                    <span class="text-[10px] text-emerald-400 font-semibold">Click to Autofill</span>
                </div>
                <div class="space-y-1.5">
                    <button type="button" onclick="fillCredentials('admin@agroloop.com', 'admin123')" 
                            class="w-full p-2.5 rounded-xl bg-slate-950/60 border border-slate-800 hover:border-emerald-500/50 hover:bg-slate-950 transition text-left flex items-center justify-between group">
                        <span class="text-xs font-bold text-slate-200 group-hover:text-emerald-400 transition">🛡️ Admin</span>
                        <span class="monospace text-[11px] text-slate-400">admin@agroloop.com</span>
                    </button>
                    <button type="button" onclick="fillCredentials('household@agroloop.com', 'household123')" 
                            class="w-full p-2.5 rounded-xl bg-slate-950/60 border border-slate-800 hover:border-emerald-500/50 hover:bg-slate-950 transition text-left flex items-center justify-between group">
                        <span class="text-xs font-bold text-slate-200 group-hover:text-emerald-400 transition">🏡 Household</span>
                        <span class="monospace text-[11px] text-slate-400">household@agroloop.com</span>
                    </button>
                    <button type="button" onclick="fillCredentials('farmer@agroloop.com', 'farmer123')" 
                            class="w-full p-2.5 rounded-xl bg-slate-950/60 border border-slate-800 hover:border-emerald-500/50 hover:bg-slate-950 transition text-left flex items-center justify-between group">
                        <span class="text-xs font-bold text-slate-200 group-hover:text-emerald-400 transition">🚜 Farmer</span>
                        <span class="monospace text-[11px] text-slate-400">farmer@agroloop.com</span>
                    </button>
                </div>
            </div>

            <!-- Back Link -->
            <div class="text-center pt-2">
                <a th:href="@{/}" class="text-xs text-slate-400 hover:text-white transition">
                    ← Return to Homepage
                </a>
            </div>
        </div>
    </div>

    <script>
        function fillCredentials(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
        }
    </script>
</body>
</html>
