spring.application.name=AgroLoop-Test

# In-Memory H2 Database for tests
spring.datasource.url=jdbc:h2:mem:agroloop_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Multipart Test Config
spring.servlet.multipart.enabled=true
agroloop.upload.dir=target/test-uploads

# OpenAPI 3.1
springdoc.api-docs.version=OPENAPI_3_1

# System & API Versioning Metadata (Phase 8 Server Discovery)
agroloop.server.version=8.0.0
agroloop.api.version=v1
agroloop.api.minimum-client-version=1.0.0
