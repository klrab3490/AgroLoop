packages:
  - 'packages/*'
  - 'web'
  - 'mobile'
  - 'desktop'
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.5'
  - '@turbo/darwin-arm64@2.11.5'
  - '@turbo/linux-64@2.11.5'
  - '@turbo/linux-arm64@2.11.5'
  - '@turbo/windows-64@2.11.5'
  - '@turbo/windows-arm64@2.11.5'
  - turbo@2.11.5
overrides:
  '@xmldom/xmldom': '>=0.8.15'
  postcss: '>=8.5.18'
  uuid: '>=11.1.1'
  decode-uri-component: '>=0.5.0'
  react: '19.2.3'
  react-dom: '19.2.3'
  vitest: '>=4.1.11'
  '@vitest/mocker': '>=4.1.11'
  postcss-selector-parser@<7.1.6: ^7.1.6
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
peerDependencyRules:
  allowedVersions:
    '@react-native/metro-config': '*'
    'react-native-worklets': '*'
  ignoreMissing:
    - '@react-native/metro-config'
    - 'react-native-worklets'



