name: AgroLoop Clients CI

on:
  push:
    branches:
      - dev
    paths:
      - 'clients/**'
      - '.github/workflows/clients.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'clients/**'
      - '.github/workflows/clients.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clients-ci:
    name: Clients Monorepo Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: clients/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: OpenAPI Codegen Drift Check
        run: |
          pnpm turbo codegen:api
          git diff --exit-code packages/api-types/src/generated/schema.ts

      - name: Type Check Workspace
        run: pnpm turbo type-check

      - name: Lint Workspace
        run: pnpm turbo lint

      - name: Run Test Suites
        run: pnpm turbo test

      - name: Build All Packages and Apps
        run: pnpm turbo build
