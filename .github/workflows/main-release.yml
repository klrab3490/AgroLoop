name: AgroLoop Main Release & Packaging

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Multi-Stage Docker Container Builds (Backend & Web Frontend)
  # ============================================================================
  docker-build:
    name: Build Docker Images (Backend & Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Spring Boot Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            agroloop-backend:latest
            agroloop-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Next.js Web Client Image
        uses: docker/build-push-action@v6
        with:
          context: ./clients
          file: ./clients/web/Dockerfile
          push: false
          load: true
          tags: |
            agroloop-web:latest
            agroloop-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect Built Images & Validate Compose
        run: |
          docker image ls | grep agroloop
          docker compose config --quiet
          docker compose -f docker-compose.local.yml config --quiet

  # ============================================================================
  # 2. Mobile App Package Creation (Expo Bundle & Standalone Android APK)
  # ============================================================================
  mobile-packages:
    name: Build Mobile App Packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: clients/pnpm-lock.yaml

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace Packages
        run: pnpm turbo build

      - name: Export Mobile Production Bundle (Expo Export)
        run: pnpm --filter @agroloop/mobile exec expo export

      - name: Upload Mobile Expo Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agroloop-mobile-expo-export
          path: clients/mobile/dist
          retention-days: 14

      - name: Generate Android Native Project (Expo Prebuild)
        run: |
          pnpm --filter @agroloop/mobile exec expo prebuild --platform android --clean --no-install
          test -d mobile/android || { echo "::error::Native android directory was not created by expo prebuild!"; exit 1; }

      - name: Configure Android Kotlin & Compose Compatibility
        working-directory: clients/mobile/android
        run: |
          cat << 'EOF' >> build.gradle

          rootProject.ext.kotlinVersion = '1.9.25'

          allprojects {
              plugins.withId('kotlin-android') {
                  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                      kotlinOptions {
                          freeCompilerArgs += [
                              "-P",
                              "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=true"
                          ]
                      }
                  }
              }

              tasks.matching { it.name.toLowerCase().contains("packagelist") }.configureEach {
                  doLast {
                      if (rootProject.projectDir.exists()) {
                          fileTree(dir: rootProject.projectDir, includes: ['**/PackageList.java']).each { f ->
                              if (f.exists()) {
                                  def text = f.text
                                  if (text.contains("expo.core.ExpoModulesPackage")) {
                                      println "Fixing expo.core.ExpoModulesPackage in PackageList task: ${f}"
                                      f.text = text.replaceAll("expo\\.core\\.ExpoModulesPackage", "expo.modules.ExpoModulesPackage")
                                  }
                              }
                          }
                      }
                  }
              }

              tasks.withType(JavaCompile).configureEach {
                  doFirst {
                      if (rootProject.projectDir.exists()) {
                          fileTree(dir: rootProject.projectDir, includes: ['**/PackageList.java']).each { f ->
                              if (f.exists()) {
                                  def text = f.text
                                  if (text.contains("expo.core.ExpoModulesPackage")) {
                                      println "Fixing expo.core.ExpoModulesPackage in JavaCompile: ${f}"
                                      f.text = text.replaceAll("expo\\.core\\.ExpoModulesPackage", "expo.modules.ExpoModulesPackage")
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Standalone Android Debug APK
        working-directory: clients/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug -Pandroid.kotlinVersion=1.9.25 -PkotlinVersion=1.9.25 --no-daemon

      - name: Upload Standalone Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agroloop-mobile-android-debug
          path: clients/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # ============================================================================
  # 3. Desktop Application Packaging - Linux (.deb & .AppImage)
  # ============================================================================
  desktop-linux:
    name: Build Desktop Linux App (Tauri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: clients/pnpm-lock.yaml

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace Packages
        run: pnpm turbo build

      - name: Build Tauri Desktop Linux Bundles
        run: pnpm --filter @agroloop/desktop exec tauri build

      - name: Upload Desktop Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agroloop-desktop-linux-x86_64
          path: |
            clients/desktop/src-tauri/target/release/bundle/deb/*.deb
            clients/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            clients/desktop/src-tauri/target/release/agroloop-desktop
          if-no-files-found: warn
          retention-days: 14

  # ============================================================================
  # 4. Desktop Application Packaging - Windows (.msi & .exe)
  # ============================================================================
  desktop-windows:
    name: Build Desktop Windows App (Tauri)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: clients/pnpm-lock.yaml

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace Packages
        run: pnpm turbo build

      - name: Build Tauri Desktop Windows Bundles
        run: pnpm --filter @agroloop/desktop exec tauri build

      - name: Upload Desktop Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agroloop-desktop-windows-x64
          path: |
            clients/desktop/src-tauri/target/release/bundle/msi/*.msi
            clients/desktop/src-tauri/target/release/bundle/nsis/*.exe
            clients/desktop/src-tauri/target/release/agroloop-desktop.exe
          if-no-files-found: warn
          retention-days: 14
