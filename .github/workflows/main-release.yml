name: AgroLoop Main Release & Packaging

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. Multi-Stage Docker Container Builds (Backend & Web Frontend)
  # ============================================================================
  docker-build:
    name: Build Docker Images (Backend & Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Spring Boot Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            agroloop-backend:latest
            agroloop-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Next.js Web Client Image
        uses: docker/build-push-action@v6
        with:
          context: ./clients
          file: ./clients/web/Dockerfile
          push: false
          load: true
          tags: |
            agroloop-web:latest
            agroloop-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect Built Images & Validate Compose
        run: |
          docker image ls | grep agroloop
          docker compose config --quiet
          docker compose -f docker-compose.local.yml config --quiet

  # ============================================================================
  # 2. Mobile App Package Creation (Expo Bundle & Standalone Android APK)
  # ============================================================================
  mobile-packages:
    name: Build Mobile App Packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: clients/pnpm-lock.yaml

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace Packages
        run: pnpm turbo build

      - name: Export Mobile Production Bundle (Expo Export)
        run: pnpm --filter @agroloop/mobile exec expo export

      - name: Upload Mobile Expo Bundle Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: agroloop-mobile-expo-export
          path: clients/mobile/dist
          retention-days: 14

      - name: Generate Android Native Project (Expo Prebuild)
        run: |
          pnpm --filter @agroloop/mobile exec expo prebuild --platform android --clean --no-install
          test -d mobile/android || { echo "::error::Native android directory was not created by expo prebuild!"; exit 1; }

      - name: Build Standalone Android Debug APK
        working-directory: clients/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon

      - name: Upload Standalone Android APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: agroloop-mobile-android-debug
          path: clients/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

  # ============================================================================
  # 3. Desktop Application Packaging - Linux (.deb & .AppImage)
  # ============================================================================
  desktop-linux:
    name: Build Desktop Linux App (Tauri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: clients/pnpm-lock.yaml

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace Packages
        run: pnpm turbo build

      - name: Build Tauri Desktop Linux Bundles
        run: pnpm --filter @agroloop/desktop exec tauri build

      - name: Upload Desktop Linux Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: agroloop-desktop-linux-x86_64
          path: |
            clients/desktop/src-tauri/target/release/bundle/deb/*.deb
            clients/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            clients/desktop/src-tauri/target/release/agroloop-desktop
          if-no-files-found: warn
          retention-days: 14

  # ============================================================================
  # 4. Desktop Application Packaging - Windows (.msi & .exe)
  # ============================================================================
  desktop-windows:
    name: Build Desktop Windows App (Tauri)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: clients/pnpm-lock.yaml

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace Packages
        run: pnpm turbo build

      - name: Build Tauri Desktop Windows Bundles
        run: pnpm --filter @agroloop/desktop exec tauri build

      - name: Upload Desktop Windows Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: agroloop-desktop-windows-x64
          path: |
            clients/desktop/src-tauri/target/release/bundle/msi/*.msi
            clients/desktop/src-tauri/target/release/bundle/nsis/*.exe
            clients/desktop/src-tauri/target/release/agroloop-desktop.exe
          if-no-files-found: warn
          retention-days: 14

  # ============================================================================
  # 5. Automated GitHub Release Publication
  # ============================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [docker-build, mobile-packages, desktop-linux, desktop-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Mobile Bundle Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: agroloop-mobile-expo-export
          path: release-assets/mobile-expo-bundle

      - name: Download Mobile APK Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: agroloop-mobile-android-debug
          path: release-assets/mobile-android

      - name: Download Desktop Linux Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: agroloop-desktop-linux-x86_64
          path: release-assets/desktop-linux

      - name: Download Desktop Windows Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: agroloop-desktop-windows-x64
          path: release-assets/desktop-windows

      - name: Consolidate Release Distribution Files
        run: |
          mkdir -p dist-release
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME:-v1.0.6}"
          # Package Mobile Expo Web Bundle into Zip if present
          if [ -d "release-assets/mobile-expo-bundle" ]; then
            (cd release-assets/mobile-expo-bundle && zip -r ../../dist-release/AgroLoop-Mobile-${VERSION}-expo-bundle.zip .)
          fi
          # Android APK
          if [ -d "release-assets/mobile-android" ]; then
            cp release-assets/mobile-android/*.apk dist-release/AgroLoop-Mobile-${VERSION}-android-debug.apk 2>/dev/null || true
          fi
          # Desktop Linux packages (.deb, .AppImage)
          if [ -d "release-assets/desktop-linux" ]; then
            find release-assets/desktop-linux -name "*.deb" -exec cp {} dist-release/AgroLoop-Desktop-${VERSION}-linux-amd64.deb \; 2>/dev/null || true
            find release-assets/desktop-linux -name "*.AppImage" -exec cp {} dist-release/AgroLoop-Desktop-${VERSION}-linux-x86_64.AppImage \; 2>/dev/null || true
          fi
          # Desktop Windows packages (.msi, setup .exe)
          if [ -d "release-assets/desktop-windows" ]; then
            find release-assets/desktop-windows -name "*.msi" -exec cp {} dist-release/AgroLoop-Desktop-${VERSION}-windows-x64.msi \; 2>/dev/null || true
            find release-assets/desktop-windows -name "*setup.exe" -exec cp {} dist-release/AgroLoop-Desktop-${VERSION}-windows-x64-setup.exe \; 2>/dev/null || true
          fi
          ls -lh dist-release/

      - name: Upload Consolidated Release Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: agroloop-release-distribution
          path: dist-release/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          gh release view "$TAG_NAME" >/dev/null 2>&1 && {
            echo "Release $TAG_NAME already exists, uploading assets..."
            gh release upload "$TAG_NAME" dist-release/* --clobber
          } || {
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" dist-release/* \
              --title "AgroLoop $TAG_NAME — Production Release" \
              --notes "Production release packages for Linux (.deb, .AppImage), Windows (.msi, .exe), Android (.apk), and Mobile Expo Bundle."
          }
