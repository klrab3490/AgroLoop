services:
  # ==========================================================
  # PostgreSQL Database Service
  # ==========================================================
  postgres:
    image: pgvector/pgvector:pg18
    container_name: agroloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agroloop}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agroloop_pgdata:/var/lib/postgresql
    healthcheck:
      test: pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agroloop-network

  # ==========================================================
  # Java Spring Boot Server Service
  # ==========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agroloop-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-agroloop}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PORT: 8080
      UPLOAD_DIR: /app/uploads
      AGROLOOP_CORS_ALLOWED_ORIGINS: ${AGROLOOP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,https://*.ngrok-free.app,https://*.ngrok.app}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - agroloop_uploads:/app/uploads
    networks:
      - agroloop-network

  # ==========================================================
  # Next.js Web Frontend Service
  # ==========================================================
  web:
    build:
      context: ./clients
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: agroloop-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      BACKEND_API_URL: ${BACKEND_API_URL:-http://app:8080}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      - app
    networks:
      - agroloop-network

  # ==========================================================
  # Optional pgAdmin Management UI (activate with: --profile tools)
  # ==========================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agroloop-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@agroloop.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5055}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agroloop-network
    profiles:
      - tools

  # ==========================================================
  # ngrok Public Tunnel Services (activate with: --profile tunnel or docker compose up ngrok-web ngrok-api)
  # ==========================================================
  ngrok-web:
    image: ngrok/ngrok:latest
    container_name: agroloop-ngrok-web
    restart: unless-stopped
    command:
      - "http"
      - "web:3000"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "${NGROK_WEB_PORT:-${NGROK_PORT:-4040}}:4040"
    depends_on:
      - web
    networks:
      - agroloop-network
    profiles:
      - tunnel
      - tools

  ngrok-api:
    image: ngrok/ngrok:latest
    container_name: agroloop-ngrok-api
    restart: unless-stopped
    command:
      - "http"
      - "app:8080"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "${NGROK_API_PORT:-4041}:4040"
    depends_on:
      - app
    networks:
      - agroloop-network
    profiles:
      - tunnel
      - tools


volumes:
  agroloop_pgdata:
    name: agroloop_pgdata
  agroloop_uploads:
    name: agroloop_uploads

networks:
  agroloop-network:
    name: agroloop-network
