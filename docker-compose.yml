version: '3.8'

services:
  # ==========================================================
  # PostgreSQL Database Service
  # ==========================================================
  postgres:
    image: postgres:16-alpine
    container_name: agroloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agroloop}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-7200}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agroloop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agroloop}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agroloop-network

  # ==========================================================
  # Java Spring Boot Server Service
  # ==========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agroloop-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-agroloop}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-7200}
      PORT: 8080
      UPLOAD_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - agroloop_uploads:/app/uploads
    networks:
      - agroloop-network

  # ==========================================================
  # Optional pgAdmin Management UI (activate with: --profile tools)
  # ==========================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agroloop-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@agroloop.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5055}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agroloop-network
    profiles:
      - tools

volumes:
  agroloop_pgdata:
    name: agroloop_pgdata
  agroloop_uploads:
    name: agroloop_uploads

networks:
  agroloop-network:
    name: agroloop-network
